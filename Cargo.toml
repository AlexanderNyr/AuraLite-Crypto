[workspace]
resolver = "3"
exclude = ["fuzz", "examples"]
members = [
    "crates/aura-types",
    "crates/aura-codec",
    "crates/aura-crypto",
    "crates/aura-tx",
    "crates/aura-block",
    "crates/aura-state",
    "crates/aura-genesis",
    "crates/aura-testkit",
    "crates/aura-storage",
    "crates/aura-exec",
    "crates/aura-consensus",
    "crates/aura-p2p",
    "crates/aura-mempool",
    "crates/aura-rpc",
    "crates/aura-node",
    "crates/aura-sdk",
    "crates/aura-sdk-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
repository = "https://github.com/AlexanderNyr/AuraLite-Crypto"
publish = false

# C9 adds the 15th crate, `aura-testkit` (proptest + fuzz harness).
# C8 added the 14th crate, `aura-genesis`, and the first new external
# dependency since C3 (serde_json, config parsing only).
# C7 gives `aura-state` its first real API (no new crate or dependency).
# C5 added the 13th crate, `aura-block`, with no new external dependencies.
# C4 added the 12th crate, `aura-tx`.
# C3 introduces the first EXTERNAL dependencies. Rules (ROADMAP 7 / H1):
#   * exact `=x.y.z` pins only — no carets, no wildcards, no git deps;
#   * the resolved set is recorded in docs/spec/c3-dependency-allowlist.txt
#     and checked by tools/check_deps.py inside `make test`;
#   * full `cargo deny` (licenses + advisories) arrives with H1;
#   * `blake3` uses `pure` so no C/assembly code enters the consensus path.
[workspace.dependencies]
aura-types = { path = "crates/aura-types" }
aura-codec = { path = "crates/aura-codec" }
aura-crypto = { path = "crates/aura-crypto" }
aura-tx = { path = "crates/aura-tx" }
aura-block = { path = "crates/aura-block" }
aura-state = { path = "crates/aura-state" }
aura-genesis = { path = "crates/aura-genesis" }
aura-testkit = { path = "crates/aura-testkit" }
aura-sdk = { path = "crates/aura-sdk", default-features = false }
aura-sdk-macros = { path = "crates/aura-sdk-macros" }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure", "std"] }
ed25519-dalek = { version = "=2.2.0" }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }
subtle = { version = "=2.6.1", default-features = false }
# B2: blst for BLS12-381 threshold signatures (QC aggregation).
blst = { version = "=0.3.14" }
# S4: sha2 is already in Cargo.lock via k256, no new external crate.
sha2 = "=0.10.9"
# C8: serde_json is used ONLY to parse the genesis CONFIG file.
# Consensus encoding stays aura-codec; no serde derive in any crate.
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# C10/S2: RocksDB is linked DYNAMICALLY to the system librocksdb-dev.
# `default-features = false` disables the bundled C++ build (which needs GB
# of RAM); `bindgen-runtime` generates bindings from the installed headers.
# Required env: ROCKSDB_LIB_DIR, ROCKSDB_INCLUDE_DIR, LIBCLANG_PATH.
rocksdb = { version = "=0.23.0", default-features = false, features = ["bindgen-runtime"] }

# D1: node skeleton — config (TOML + env + CLI), tracing, signals, PID file,
# health probe. Exact pins only (ROADMAP C3 rule).
# serde is intentionally NOT a direct dependency here — it is a D4 rule
# (serde lands with JSON-RPC). D1 parses TOML with toml::Value instead.
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter"] }
# C9: proptest is a DEV dependency of aura-testkit only. Minimal
# features (no fork/timeout) to keep the resolved set small.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# X1: the default engine is `wasmi`, a deterministic WASM interpreter.
# `default-features = false` keeps SIMD out of the build (we never enable it);
# `deterministic` uses the platform-independent float/math path; `validate`
# enables the validator (and `Config::floats`); `portable-dispatch` selects the
# portable instruction dispatcher so an x86 node and an ARM node execute the
# same bytecode the same way. MEASURED: with neither `auto-dispatch` nor
# `portable-dispatch` selected, the interpreter overflows the native stack on a
# simple `loop { br 0 }` instead of consuming fuel (wasmi 2.0.0, 2026-10-28) —
# the X1 fuel gate caught it. Exact pin: fuel costs are version-sensitive, so
# bumping wasmi is a protocol decision with its own patch.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "deterministic", "portable-dispatch"] }
# X1: optional JIT backend behind `wasmtime-engine`. Not part of the default
# build: Cranelift does not compile on a 2 GB machine, so its gate is a
# separate CI job (see docs/evidence/x1/report.md).
wasmtime = { version = "=50.0.0" }

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
