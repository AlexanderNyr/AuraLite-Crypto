# AuraLite supply-chain policy (H1)
#
# Normative policy consumed by BOTH the real `cargo-deny` (v0.20.2, auxiliary)
# and the deterministic gate `tools/check_supply_chain.py` (the phase gate).
# See docs/h1-supply-chain-plan.md (D-H1-1..6).

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-git = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
