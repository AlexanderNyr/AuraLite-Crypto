# cargo-fuzz workspace. Deliberately EXCLUDED from the main workspace: these
# targets need nightly + libFuzzer and must not affect `make test` or the
# dependency allowlist. H3 runs the 24-hour campaign; C9 runs the portable
# stable-Rust harness (`aura-fuzz`) for the 60-second gate.
[package]
name = "aura-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
aura-testkit = { path = "../crates/aura-testkit" }
aura-rpc = { path = "../crates/aura-rpc" }
aura-wallet = { path = "../crates/aura-wallet" }
serde_json = "=1.0.154"
# Differential oracle for the test-only scrypt fork fuzzer.
scrypt = { version = "=0.11.0", default-features = false }
scrypt-w1-wipe = { path = "../third_party/scrypt-w1" }

[features]
# Only the isolated decrypt fuzzer enables weak Argon2 parameters. Never use
# this feature in application or production builds.
insecure-wallet-fuzz = ["aura-wallet/insecure-test-kdf"]

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_codec"
path = "fuzz_targets/fuzz_codec.rs"
test = false
doc = false

[[bin]]
name = "fuzz_tx"
path = "fuzz_targets/fuzz_tx.rs"
test = false
doc = false

[[bin]]
name = "fuzz_state_key"
path = "fuzz_targets/fuzz_state_key.rs"
test = false
doc = false

[[bin]]
name = "fuzz_genesis_json"
path = "fuzz_targets/fuzz_genesis_json.rs"
test = false
doc = false

[[bin]]
name = "fuzz_rpc"
path = "fuzz_targets/fuzz_rpc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_keystore_parse"
path = "fuzz_targets/fuzz_keystore_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_keystore_decrypt"
path = "fuzz_targets/fuzz_keystore_decrypt.rs"
required-features = ["insecure-wallet-fuzz"]
test = false
doc = false

[[bin]]
name = "fuzz_scrypt_differential"
path = "fuzz_targets/fuzz_scrypt_differential.rs"
test = false
doc = false

[[bin]]
name = "fuzz_recovery_metadata"
path = "fuzz_targets/fuzz_recovery_metadata.rs"
test = false
doc = false
