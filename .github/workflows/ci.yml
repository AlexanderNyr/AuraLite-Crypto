name: CI

on:
  push:
    branches: [main]
  pull_request:

# C0 baseline: one honest shard. The 10 shards listed in CONTRIBUTING.md
# (core, state, exec, consensus, net, node, wallet, ecosystem, security,
# perf) are added by O0 as the crates that need them actually appear.
jobs:
  core:
    name: core (C0-C10 + S0-S7 gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: deps-check
        run: make deps-check

      - name: make test
        run: make test

      - name: golden vectors are reproducible (C1-C9 + S0-S7)
        run: make gen-c1-vectors && make gen-c2-vectors && make gen-c3-vectors && make gen-c4-vectors && make gen-c5-vectors && make gen-c6-vectors && make gen-c7-vectors && make gen-c8-vectors && make gen-c9-vectors && make gen-s0-vectors && make gen-s1-vectors && make gen-s2-vectors && make gen-s3-vectors && make gen-s4-vectors && make gen-s5-vectors && make gen-s6-vectors && make gen-s7-vectors

      - name: vector inventory (>= 200)
        run: make vector-inventory

      # C9 CORE shard: golden vectors + proptest + short deterministic fuzz.
      - name: CORE shard
        run: make test-core

      # C9 DoD: 60 seconds of fuzzing with zero panics on stable Rust.
      - name: fuzz smoke (60 s)
        run: make fuzz-smoke

      # C10: plan<->tree audit — no ✅ row without a receipt.
      - name: close-out audit
        run: make audit-closeout

      # nc-all runs all 92 NCs without rewriting the historical logs,
      # so those committed SHA256SUMS remain valid in the uploaded artifact.
      - name: negative controls (C0-C10 + S0-S7, 104 total)
        run: make nc-all

      # Only the CURRENT phase's evidence is regenerated. C0-S4 evidence is a
      # HISTORICAL committed record measured at its own commit; regenerating
      # it later would relabel the wrong tree.
      - name: current phase evidence (S7)
        run: make evidence-s7

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-s7-evidence
          path: |
            docs/evidence/c0/
            docs/evidence/c1/
            docs/evidence/c2/
            docs/evidence/c3/
            docs/evidence/c4/
            docs/evidence/c5/
            docs/evidence/c6/
            docs/evidence/c7/
            docs/evidence/c8/
            docs/evidence/c9/
            docs/evidence/c10/
            docs/evidence/s0/
            docs/evidence/s1/
            docs/evidence/s2/
            docs/evidence/s3/
            docs/evidence/s4/
            docs/evidence/s5/
            docs/evidence/s6/
            docs/evidence/s6-dependency-addendum.txt
            docs/evidence/s7/
            docs/evidence/s7-dependency-addendum.txt
          if-no-files-found: ignore

  # S2's native RocksDB backend needs librocksdb >= 9.9 headers (Ubuntu 24.04
  # ships 8.9.1, whose C API is incompatible with rocksdb 0.23). Debian trixie
  # ships 9.10. Run the OPTIONAL feature in its own job so the default gate
  # stays reproducible without any native dependency.
  s2-native:
    name: S2 native RocksDB backend (Debian trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential pkg-config python3 make \
            clang libclang-dev librocksdb-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust 1.99.1 (rustup, pinned by rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.99.1 -c rustfmt -c clippy
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version
      - name: Native backend tests + clippy
        run: |
          . "$HOME/.cargo/env"
          make test-s2-native
