[package]
name = "aura-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "AuraLite-Crypto wallet, key exposure audit, keystore, offline signing, and multisig (W0-W4)"

[features]
# Enables intentionally weak KDF parameters solely for fast negative tests.
insecure-test-kdf = []

[[bin]]
name = "aura-wallet"
path = "src/bin/aura-wallet.rs"

[dependencies]
aura-types = { workspace = true }
aura-codec = { workspace = true }
aura-crypto = { workspace = true }
aura-tx = { workspace = true }
aura-rpc = { workspace = true }
aura-consensus = { workspace = true }
zeroize = { workspace = true }
bip39 = { workspace = true }
unicode-normalization = { workspace = true }
unicode-normalization-15-1 = { workspace = true }
bip32 = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
scrypt-w1-wipe = { path = "../../third_party/scrypt-w1" }
hmac = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true }
serde_json = { workspace = true }
k256 = { workspace = true }
hex = "=0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
# Independent upstream reference used only in differential tests.
scrypt = { workspace = true }
