[package]
name = "aura-storage"
description = "AuraLite-Crypto durable state storage: WAL + RocksDB, fsync before head publication"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "s2-writer"
path = "src/bin/s2_writer.rs"

[[bin]]
name = "s7-chaos"
path = "src/bin/s7_chaos.rs"

[dependencies]
aura-types.workspace = true
aura-codec.workspace = true
aura-crypto.workspace = true
aura-state.workspace = true
rocksdb = { workspace = true, optional = true }

[features]
default = []
rocksdb = ["dep:rocksdb"]
