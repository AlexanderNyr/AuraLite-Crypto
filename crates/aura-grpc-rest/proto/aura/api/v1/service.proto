syntax = "proto3";

package aura.api.v1;

// Stable v1 service. v1.1 is additive: response field 15 is optional and all
// existing service paths and request field numbers are unchanged.
service AuraNode {
  rpc SubmitTransaction(SubmitTransactionRequest) returns (SubmitTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc GetBlock(GetBlockRequest) returns (GetBlockResponse);
  rpc EstimateGas(EstimateGasRequest) returns (EstimateGasResponse);
  rpc ContractCall(ContractCallRequest) returns (ContractCallResponse);
}

message SubmitTransactionRequest {
  string signed_transaction_hex = 1;
}
message SubmitTransactionResponse {
  string transaction_hash = 1;
  string api_version = 15;
}

message GetBalanceRequest {
  string address = 1;
}
message GetBalanceResponse {
  string address = 1;
  string balance = 2;
  uint64 nonce = 3;
  // Added in API v1.1. Old v1 clients ignore this unknown protobuf field.
  string api_version = 15;
}

message GetTransactionRequest {
  string transaction_hash = 1;
}
message GetTransactionResponse {
  // JSON serialization of the D4 transaction result; empty when not found.
  string result_json = 1;
  string api_version = 15;
}

message GetBlockRequest {
  // Omit or set to zero to request the latest committed block.
  optional uint64 height = 1;
}
message GetBlockResponse {
  string result_json = 1;
  string api_version = 15;
}

message EstimateGasRequest {
  string kind = 1;
  string signed_transaction_hex = 2;
}
message EstimateGasResponse {
  uint64 gas_units = 1;
  string gas = 2;
  string api_version = 15;
}

message ContractCallRequest {
  string params_json = 1;
}
message ContractCallResponse {
  string result_json = 1;
  string api_version = 15;
}
