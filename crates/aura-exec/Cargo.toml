[package]
name = "aura-exec"
description = "AuraLite-Crypto deterministic WASM execution: census (X0) and sandbox (X1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Optional JIT backend. Cranelift needs a big machine to compile, so this
# feature is exercised by a dedicated CI job, never by `make test`.
wasmtime-engine = ["dep:wasmtime"]

[dependencies]
# X2: the ABI writes into the S3 overlay and the C7 account model, so the
# executor depends on the state crate. No new EXTERNAL crate: these are
# workspace crates that already existed.
aura-types = { workspace = true }
aura-crypto = { workspace = true }
aura-state = { workspace = true }
wasmi = { workspace = true }
wasmtime = { workspace = true, optional = true }
