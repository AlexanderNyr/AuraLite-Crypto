# Local W1 maintenance fork of RustCrypto scrypt 0.11.0. See PROVENANCE.md.
[package]
name = "scrypt-w1-wipe"
version = "0.11.0"
edition = "2021"
rust-version = "1.60"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
pbkdf2 = "=0.12.2"
salsa20 = { version = "=0.10.2", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
password-hash = { version = "=0.5.0", default-features = false, features = ["rand_core"], optional = true }

[features]
default = []
simple = ["dep:password-hash"]
std = ["password-hash/std"]
