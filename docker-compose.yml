version: "3.9"

x-validator-common: &validator-common
  build:
    context: .
  environment:
    AURA_DEVNET_DIR: /var/lib/aura-devnet
    RUST_LOG: info
  volumes:
    - devnet-shared:/var/lib/aura-devnet

services:
  validator-0:
    <<: *validator-common
    container_name: aura-devnet-validator-0
    environment:
      AURA_DEVNET_DIR: /var/lib/aura-devnet
      AURA_VALIDATOR_INDEX: "0"
    command:
      - aurad
      - --chain-id
      - auralite-devnet-1
      - --data-dir
      - /var/lib/aura-devnet/validator-0
      - --rpc-addr
      - 0.0.0.0:18545
      - --grpc-addr
      - 0.0.0.0:19090
      - --validator-key
      - /var/lib/aura-devnet/validator-0/validator.key
    ports:
      - "18545:18545"
      - "19090:19090"

  validator-1:
    <<: *validator-common
    container_name: aura-devnet-validator-1
    environment:
      AURA_DEVNET_DIR: /var/lib/aura-devnet
      AURA_VALIDATOR_INDEX: "1"
    command:
      - aurad
      - --chain-id
      - auralite-devnet-1
      - --data-dir
      - /var/lib/aura-devnet/validator-1
      - --rpc-addr
      - 0.0.0.0:18546
      - --grpc-addr
      - 0.0.0.0:19091
      - --validator-key
      - /var/lib/aura-devnet/validator-1/validator.key
    ports:
      - "18546:18546"
      - "19091:19091"

  validator-2:
    <<: *validator-common
    container_name: aura-devnet-validator-2
    environment:
      AURA_DEVNET_DIR: /var/lib/aura-devnet
      AURA_VALIDATOR_INDEX: "2"
    command:
      - aurad
      - --chain-id
      - auralite-devnet-1
      - --data-dir
      - /var/lib/aura-devnet/validator-2
      - --rpc-addr
      - 0.0.0.0:18547
      - --grpc-addr
      - 0.0.0.0:19092
      - --validator-key
      - /var/lib/aura-devnet/validator-2/validator.key
    ports:
      - "18547:18547"
      - "19092:19092"

  validator-3:
    <<: *validator-common
    container_name: aura-devnet-validator-3
    environment:
      AURA_DEVNET_DIR: /var/lib/aura-devnet
      AURA_VALIDATOR_INDEX: "3"
    command:
      - aurad
      - --chain-id
      - auralite-devnet-1
      - --data-dir
      - /var/lib/aura-devnet/validator-3
      - --rpc-addr
      - 0.0.0.0:18548
      - --grpc-addr
      - 0.0.0.0:19093
      - --validator-key
      - /var/lib/aura-devnet/validator-3/validator.key
    ports:
      - "18548:18548"
      - "19093:19093"

volumes:
  devnet-shared:
